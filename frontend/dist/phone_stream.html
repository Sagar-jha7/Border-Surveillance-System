<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Border Surveillance — Mobile Patrol Stream</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1.25rem;
    }
    .header { text-align: center; margin-bottom: 1rem; }
    h1 { font-size: 1.3rem; margin-bottom: 0.35rem; color: #38bdf8; font-weight: 700; }
    p.sub { font-size: 0.85rem; color: #94a3b8; max-width: 380px; line-height: 1.4; }
    
    #status {
      font-size: 0.85rem; padding: 0.45rem 1.2rem;
      border-radius: 999px; margin-bottom: 1rem;
      background: #1e293b; color: #94a3b8; font-weight: 600;
      border: 1px solid #334155; transition: all 0.2s; text-align: center;
    }
    #status.connected { background: #14532d; color: #86efac; border-color: #22c55e; }
    #status.error { background: #7f1d1d; color: #fca5a5; border-color: #ef4444; }
    #status.warning { background: #78350f; color: #fde68a; border-color: #d97706; }

    .notice-card {
      background: #1e293b; border: 1px solid #d97706;
      border-radius: 10px; padding: 0.85rem; width: 100%;
      max-width: 480px; margin-bottom: 1rem; font-size: 0.82rem; color: #fde68a;
      display: none; line-height: 1.4;
    }
    .notice-card a { color: #38bdf8; font-weight: bold; text-decoration: underline; }

    .video-container {
      width: 100%; max-width: 480px; position: relative;
      border-radius: 10px; overflow: hidden;
      border: 2px solid #334155; margin-bottom: 1rem;
      background: #000; aspect-ratio: 4/3;
    }
    video {
      width: 100%; height: 100%; object-fit: cover;
    }
    canvas { display: none; }

    .config-card {
      background: #1e293b; border: 1px solid #334155;
      border-radius: 10px; padding: 1rem; width: 100%;
      max-width: 480px; margin-bottom: 1rem;
    }
    label { font-size: 0.8rem; color: #94a3b8; display: block; margin-bottom: 0.4rem; font-weight: 500; }
    input[type=text] {
      width: 100%; padding: 0.55rem 0.75rem; border-radius: 6px;
      border: 1px solid #475569; background: #0f172a;
      color: #e2e8f0; font-size: 0.95rem; font-family: monospace;
    }

    .controls { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; max-width: 480px; }
    button {
      width: 100%; padding: 0.75rem 1rem; border: none; border-radius: 8px;
      font-size: 1rem; cursor: pointer; font-weight: 700; transition: background 0.2s;
    }
    #btnStart { background: #2563eb; color: white; }
    #btnStart:hover { background: #1d4ed8; }
    #btnStop  { background: #dc2626; color: white; display: none; }
    #btnStop:hover { background: #b91c1c; }
    #btnHttps { background: #059669; color: white; margin-top: 0.3rem; display: none; }

    #fps-info { font-size: 0.85rem; color: #38bdf8; margin-top: 0.75rem; font-family: monospace; font-weight: 600; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📱 Mobile Patrol Streamer</h1>
    <p class="sub">Stream your phone camera in real time to the Surveillance Dashboard</p>
  </div>

  <div id="status">Checking Camera Capabilities...</div>

  <div id="httpsNotice" class="notice-card">
    🔒 <strong>HTTPS Required for Camera Access</strong><br/>
    Mobile browsers block camera access on plain HTTP.<br/>
    <button id="btnHttps" onclick="switchToHttps()">🔐 Switch to Secure HTTPS Stream</button>
  </div>

  <div class="video-container">
    <video id="video" autoplay playsinline muted></video>
  </div>
  <canvas id="canvas"></canvas>

  <div class="config-card">
    <label for="clientId">Patrol Unit ID / Camera ID:</label>
    <input type="text" id="clientId" value="phone_01" />
  </div>

  <div class="controls">
    <button id="btnStart">▶ Start Camera Stream</button>
    <button id="btnStop">⏹ Stop Stream</button>
  </div>

  <div id="fps-info"></div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusEl = document.getElementById('status');
    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const btnHttps = document.getElementById('btnHttps');
    const httpsNotice = document.getElementById('httpsNotice');
    const fpsInfo = document.getElementById('fps-info');

    const TARGET_FPS = 15;
    const QUALITY = 0.45; // lightweight JPEG for zero latency
    const STREAM_WIDTH = 640;
    const STREAM_HEIGHT = 480;

    let ws = null;
    let stream = null;
    let streaming = false;
    let isSending = false;
    let framesSent = 0;
    let t0 = Date.now();

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls || '';
    }

    function checkProtocol() {
      const isHttps = location.protocol === 'https:';
      const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

      if (!isHttps && !isLocalhost) {
        setStatus('⚠️ Insecure Connection (HTTP). Tap below for HTTPS.', 'warning');
        httpsNotice.style.display = 'block';
        btnHttps.style.display = 'block';
      } else {
        setStatus('Ready to Stream', '');
      }
    }

    function switchToHttps() {
      const httpsUrl = 'https://' + location.hostname + ':8443' + location.pathname;
      location.href = httpsUrl;
    }

    async function getCameraStream() {
      if (!navigator.mediaDevices) {
        navigator.mediaDevices = {};
      }

      if (!navigator.mediaDevices.getUserMedia) {
        const legacyGetUserMedia = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia || navigator.msGetUserMedia;
        if (legacyGetUserMedia) {
          navigator.mediaDevices.getUserMedia = function(constraints) {
            return new Promise((resolve, reject) => {
              legacyGetUserMedia.call(navigator, constraints, resolve, reject);
            });
          };
        }
      }

      if (!navigator.mediaDevices.getUserMedia) {
        throw new Error("Your mobile browser requires HTTPS to access the camera. Tap 'Switch to Secure HTTPS Stream' above.");
      }

      try {
        return await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: STREAM_WIDTH }, height: { ideal: STREAM_HEIGHT } },
          audio: false,
        });
      } catch (e1) {
        return await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      }
    }

    function scheduleFrame() {
      if (!streaming) return;
      setTimeout(captureAndSend, 1000 / TARGET_FPS);
    }

    function captureAndSend() {
      if (!streaming || !ws || ws.readyState !== WebSocket.OPEN) {
        if (streaming) scheduleFrame();
        return;
      }

      if (isSending) {
        scheduleFrame();
        return;
      }

      isSending = true;
      try {
        if (video.videoWidth > 0) {
          canvas.width = STREAM_WIDTH;
          canvas.height = STREAM_HEIGHT;
          ctx.drawImage(video, 0, 0, STREAM_WIDTH, STREAM_HEIGHT);
          const b64 = canvas.toDataURL('image/jpeg', QUALITY).split(',')[1];
          ws.send(b64);
          framesSent++;
          const elapsed = (Date.now() - t0) / 1000;
          if (elapsed > 0) {
            fpsInfo.textContent = `Streaming: ${(framesSent / elapsed).toFixed(1)} FPS (${framesSent} frames)`;
          }
        }
      } catch (err) {
        console.error('Frame error:', err);
      } finally {
        isSending = false;
        scheduleFrame();
      }
    }

    async function startStream() {
      const clientId = document.getElementById('clientId').value.trim() || 'phone_01';
      const isHttps = location.protocol === 'https:';
      const wsProtocol = isHttps ? 'wss:' : 'ws:';
      const wsUrl = `${wsProtocol}//${location.host}/ws/phone/${clientId}`;

      try {
        stream = await getCameraStream();
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        setStatus(err.message, 'error');
        if (!isHttps && location.hostname !== 'localhost') {
          httpsNotice.style.display = 'block';
          btnHttps.style.display = 'block';
        }
        return;
      }

      setStatus(`Connecting to backend...`, '');

      try {
        ws = new WebSocket(wsUrl);
      } catch (e) {
        setStatus(`WebSocket Error: ${e.message}`, 'error');
        return;
      }

      ws.onopen = () => {
        setStatus(`🟢 Streaming Live as ${clientId}`, 'connected');
        btnStart.style.display = 'none';
        btnStop.style.display = 'block';
        streaming = true;
        isSending = false;
        framesSent = 0;
        t0 = Date.now();
        scheduleFrame();
      };

      ws.onerror = (e) => setStatus('WebSocket Connection Error', 'error');
      ws.onclose = () => {
        setStatus('Disconnected from server', '');
        btnStart.style.display = 'block';
        btnStop.style.display = 'none';
        streaming = false;
        fpsInfo.textContent = '';
      };
    }

    function stopStream() {
      streaming = false;
      if (ws) ws.close();
      if (stream) stream.getTracks().forEach(t => t.stop());
      video.srcObject = null;
      setStatus('Stream Stopped', '');
      btnStart.style.display = 'block';
      btnStop.style.display = 'none';
      fpsInfo.textContent = '';
    }

    btnStart.addEventListener('click', startStream);
    btnStop.addEventListener('click', stopStream);

    checkProtocol();
  </script>
</body>
</html>
